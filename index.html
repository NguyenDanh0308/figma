<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Layout Website</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow-x: hidden;
        }
        .header {
            width: 100%;
            max-width: 1366px;
            height: 100px;
            margin: 15px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            width: 15%;
            height: 60px;
            background: #ddd;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
        }
        .menu {
            width: 60%;
            height: 34px;
            background: #E2E2E2;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
        }
        .button {
            width: 10%;
            height: 42px;
            background: #E2E2E2;
            border-radius: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
        }
        .background {
            width: 100%;
            background: #f1f1f1;
        }
        .main {
            width: 100%;
            max-width: 1366px;
            height: 680px;
            margin: 15px auto;
            padding: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }
        .content {
            width: 50%;
            height: 267px;
            background: #E2E2E2;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
        }
        .image {
            width: 50%;
            height: 520px;
            background: #E2E2E2;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
        }
        .title {
            width: 600px;
            max-width: 100%;
            height: 80px;
            margin: 80px auto 40px; 
            padding: 0;
            background: #ddd;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-family: 'lora';
        }
        .items1 {
            width: 100%;
            max-width: 1366px;
            margin: 0 auto 80px;
            padding: 0 6%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        .item {
            width: 30%;
            height: 420px;
            background: #E2E2E2;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 500;
        }
        .items2 {
            width: 100%;
            max-width: 1366px;
            margin: 0 auto;
            padding: 0 0 80px;
            display: flex;
            gap: 30px;
        }
        .item-2 {
            width: 18%;
            height: 300px;
            background: #E2E2E2;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 500;
        }
        .items3 {
            width: 100%;
            max-width: 1366px;
            margin: 0 auto 80px;
            padding: 0 6%;
            display: flex;
            gap: 30px;
        }
        .item-3 {
            width: 23%;
            height: 300px;
            background: #E2E2E2;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 500;
        }
        .footer {
            width: 100%;
            max-width: 1366px;
            height: 72px;
            margin: 0 auto;
            background: #D9D9D9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            Logo
        </div>
        <div class="menu">
            Menu
        </div>
        <div class="button">
            Button
        </div>
    </div>
    <div class="background">
        <div class="main">
            <div class="content">
                Content
            </div>
            <div class="image">
                Image
            </div>
        </div>
    </div>
    <div class="title">
        Title
    </div>
    <section class="items1">
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
    </section>
    <div class="background" style="padding-top: 80px;">
         <div class="title" style="margin: 0 auto 40px;">Title</div>
        <section class="items2">
            <div class="item-2">Item</div>
            <div class="item-2">Item</div>
            <div class="item-2">Item</div>
            <div class="item-2">Item</div>
            <div class="item-2">Item</div>
        </section>
    </div>
    <div class="title">
        Title
    </div>
    <section class="items3">
        <div class="item-3">Item</div>
        <div class="item-3">Item</div>
        <div class="item-3">Item</div>
        <div class="item-3">Item</div>
    </section>
    <div class="background" style="background-color:#D9D9D9 ;">
        <div class="footer">
            Footer
        </div>
    </div>
</body>
</html>
