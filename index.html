<!DOCTYPE html>
<html>
<head>
    <title>Layout Website</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial;
            width: 1366px;
            height:3162px;
        }
        .header {
            width: 1366px;
            height:100px;
            margin: 15px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            width: 200px;
            background-color: #ddd;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            height: 60px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Be Vietnam pro';
            line-height: 100%;
        }
        .menu {
            width: 820px;
            height: 34px;
            background-color: #E2E2E2;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
        }
        .button {
            width: 120px;
            background-color: #E2E2E2;
            text-align: center;
            font-weight: bold;
            border-radius: 7px;
            height: 42px;
        }
        .main {
            width: 1366px;
            height: 680px;
            margin: 15px auto;
            padding: 65px;
            background-color: #f1f1f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            width: 585px;
            height: 267px;
            background-color: #E2E2E2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 8px;
        }
        .image {
            width: 585px;
            height: 520px;
            background-color: #E2E2E2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 8px;
        }
        .title {
            width: 600px;
            margin: 65px auto;
            padding: 20px;
            background-color: #ddd;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            height: 80px;
        }
        .items1{
            width: 1366px;
            display: flex;
            flex-wrap:wrap;
            gap: 30px;
            padding-left: 83px;
            padding-right: 83px;
        }
        .item{
            width: 380px;
            height: 420px;
            border-radius: 8px;
            background-color: #E2E2E2;
            display:flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            font-style:20px;         
            font-family: Be Vietnam pro;                                                                                                                                                                                                                                                                                                                                                                                   
        }
        .items2{
             width: 1366px;
            display: flex;
            gap: 30px;
            padding-left: 83px;
            padding-right: 83px;
            background-color: #f1f1f1;
        }
        .item-2{
            width: 216px;
            height: 300px;
            border-radius: 8px;
            background-color: #E2E2E2;
            display:flex;
            justify-content: center;
            align-items: center;
            font-style:20px;         
            font-family: Be Vietnam pro

        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">Logo</div>
        <div class="menu">Menu</div>
        <div class="button">Button</div>
    </div>

    <div class="main">
        <div class="content">Content</div>
        <div class="image">Image</div>
    </div>

    <div class="title">Title</div>
    <section class="items1">
    <div class="item">Item</div>
    <div class="item">Item</div>
    <div class="item">Item</div>
    <div class="item">Item</div>
    <div class="item">Item</div>
    <div class="item">Item</div>
</section>
<div class="title">Title</div>
<seation class="items2">
    <div class="item-2">Item</div>
    <div class="item-2">Item</div>
    <div class="item-2">Item</div>
    <div class="item-2">Item</div>
    <div class="item-2">Item</div>
</seation>
</body>
</html>
